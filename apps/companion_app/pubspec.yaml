name: companion_app
description: "Halloween TV - Guests: guest companion (Android, iOS, Web) for Halloween TV."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Pub Workspaces resolution is intentionally not enabled yet: it requires a
# root pubspec.yaml declaring `workspace:`, which is out of scope for this
# cycle. Classic Melos-managed path dependencies are used instead; see
# docs/ADRs/0001-package-mapping.md.

dependencies:
  flutter:
    sdk: flutter

  # Monorepo packages (guest join flow).
  channel_api:
    path: ../../packages/channel_api
  core_foundation:
    path: ../../packages/core_foundation
  core_playlist:
    path: ../../packages/core_playlist
  core_ui:
    path: ../../packages/core_ui
  infra_firestore:
    path: ../../packages/infra_firestore

  # Firebase versions mirror apps/tv_app + packages/infra_firestore exactly.
  firebase_core: ^3.13.1
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
