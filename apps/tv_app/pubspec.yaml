name: tv_app
description: "Halloween TV (Haunted Surveillance) — Android TV 2x2 CCTV wall. Composition root: kernel_app registry + channel_cctv, app-owned video_player decoders per tile."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Pub Workspaces resolution is intentionally not enabled yet: it requires a
# root pubspec.yaml declaring `workspace:`, which is out of scope for this
# cycle. Classic Melos-managed path dependencies are used instead; see
# docs/ADRs/0001-package-mapping.md.

dependencies:
  flutter:
    sdk: flutter

  # Microkernel / composition root.
  kernel_app:
    path: ../../packages/kernel_app

  # Channels + contracts.
  channel_api:
    path: ../../packages/channel_api
  channel_cctv:
    path: ../../packages/channel_cctv
  channel_retro_tv:
    path: ../../packages/channel_retro_tv

  # Shared core.
  core_cache:
    path: ../../packages/core_cache
  core_foundation:
    path: ../../packages/core_foundation
  core_playlist:
    path: ../../packages/core_playlist
  core_effects:
    path: ../../packages/core_effects
  core_ui:
    path: ../../packages/core_ui

  # Playback + local persistence.
  video_player: ^2.10.0
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Test-only fakes/fixtures (`manifestFixture()`). Prod boot must load the
  # bundled fixture_manifest.json via rootBundle instead.
  testing_toolkit:
    path: ../../packages/testing_toolkit

flutter:
  uses-material-design: true
  assets:
    - assets/cam01.mp4
    - assets/cam02.mp4
    - assets/cam03.mp4
    - assets/cam04.mp4
    - assets/fixture_manifest.json
