name: tv_app
description: "Halloween TV (Haunted Surveillance) — Android TV app. Flutter + video_player. Composes kernel_app (composition root) and the channels layer; must not reach into infra_* directly (design D-08)."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Pub Workspaces resolution is intentionally not enabled yet: it requires a
# root pubspec.yaml declaring `workspace:`, which is out of scope for this
# partition. Classic Melos-managed path dependencies are used instead; see
# docs/ADRs/0001-package-mapping.md.

dependencies:
  flutter:
    sdk: flutter

  # --- Microkernel / composition root ---
  kernel_app:
    path: ../../packages/kernel_app

  # --- Channels ---
  channel_api:
    path: ../../packages/channel_api
  channel_cctv:
    path: ../../packages/channel_cctv
  channel_retro_tv:
    path: ../../packages/channel_retro_tv

  # --- Shared core ---
  core_foundation:
    path: ../../packages/core_foundation
  core_playlist:
    path: ../../packages/core_playlist
  core_cache:
    path: ../../packages/core_cache
  core_effects:
    path: ../../packages/core_effects
  core_ui:
    path: ../../packages/core_ui

  # --- Playback ---
  video_player: ^2.9.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
