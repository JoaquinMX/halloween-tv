# tv_app analyzer options — flutter_lints plus the repo-root shared baseline,
# so the app inherits the same strictness as the rest of the monorepo.
include:
  - package:flutter_lints/flutter.yaml
  - ../../analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
