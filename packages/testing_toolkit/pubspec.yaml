version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  channel_api:
    path: ../channel_api
  core_cache:
    path: ../core_cache
  core_foundation:
    path: ../core_foundation
  core_playlist:
    path: ../core_playlist

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
