name: kernel_app
description: "kernel_app — Halloween TV (Haunted Surveillance) Melos package. Microkernel: channel registry (design: app_kernel). Depends only on contracts; tv_app composes channels and infra adapters."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  channel_api:
    path: ../channel_api
  core_cache:
    path: ../core_cache
  core_foundation:
    path: ../core_foundation
  core_playlist:
    path: ../core_playlist
  infra_firestore:
    path: ../infra_firestore
  infra_signed_urls:
    path: ../infra_signed_urls

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
